name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows matches the deployment host (paths, OneDrive defaults, scheduled task).
    runs-on: windows-latest
    env:
      # Tests use in-memory SQLite and mocks; no real database or secrets are needed.
      DATABASE_DSN: sqlite://
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        shell: bash
        run: for f in static/*.js; do node --check "$f"; done
      - name: JavaScript tests
        shell: bash
        run: node --test tests/*.test.cjs
