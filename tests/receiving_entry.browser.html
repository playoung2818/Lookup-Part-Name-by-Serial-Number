<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Isolated receiving entry test</title>
<body><pre id="browser-result">RUNNING</pre><iframe id="app" title="Receiving fixture" style="width:1500px;height:900px;border:0"></iframe>
<script>
(async () => {
    const result = document.getElementById('browser-result'), frame = document.getElementById('app');
    const assert = (condition, label) => { if (!condition) throw Error(label); };
    const loaded = () => new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
    const wait = async (check, label) => {
        for (let i=0;i<150;i++) { if (await check()) return; await new Promise(resolve => setTimeout(resolve,100)); }
        throw Error(`Timed out: ${label}`);
    };
    const db = async () => (await (await fetch('/fixture-db')).json());
    const doc = () => frame.contentDocument;
    const cells = () => [...doc().querySelectorAll('.sn-input')];
    const enter = (input,text) => { input.value=text; input.dispatchEvent(new Event('input',{bubbles:true})); };
    const pressEnter = input => input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    try {
        let navigation=loaded(); frame.src='/receiving'; await navigation;
        assert(!doc().getElementById('receiving-workspace'),'no invoice loaded');
        assert(doc().getElementById('incoming-form-heading').textContent==='Generate incoming form','incoming form tool dialog');
        assert(doc().getElementById('serial-tools-heading').textContent==='Fill consecutive serials','serial tool dialog');
        assert(doc().querySelector('.rcv-header #invoice-search-form'),'Open INV# lives in the header action bar');
        assert(!doc().getElementById('shipment-upload').hidden,'New shipment panel open when nothing is loaded');
        doc().querySelector('[data-open-dialog="serial-tools-dialog"]').click();
        assert(doc().getElementById('serial-tools-dialog').open,'Tools menu opens the serial dialog');
        doc().querySelector('#serial-tools-dialog [data-close-dialog]').click();
        assert(!doc().getElementById('serial-tools-dialog').open,'dialog closes');
        const realFetch = frame.contentWindow.fetch;
        frame.contentWindow.fetch = () => {throw Error('Standalone generator must not make network requests');};
        enter(doc().getElementById('sequence-first'),'SC69031431');
        enter(doc().getElementById('sequence-count'),'20');
        doc().getElementById('sequence-form').requestSubmit();
        const output = doc().getElementById('sequence-output').value.split('\n');
        assert(output.length===20&&output[0]==='SC69031431'&&output[19]==='SC69031450','standalone generation without invoice');
        assert((await db()).writes===0,'generator never writes database');
        frame.contentWindow.fetch = realFetch;
        const form=doc().getElementById('shipment-upload-form');
        for (const [field,name] of [['receipt','receipt.pdf'],['packing','packing.pdf'],['serials','serials.xlsx']]) {
            const transfer=new DataTransfer(); transfer.items.add(new File(['fixture'],name)); form.elements[field].files=transfer.files;
        }
        navigation=loaded(); form.requestSubmit(); await navigation;
        assert(doc().querySelectorAll('#template-table tbody tr').length===6,'generated draft table');
        assert((await db()).rows.length===0,'generation does not write database records');
        assert(doc().getElementById('sequence-form'),'generator available during draft review');
        frame.contentWindow.confirm=()=>true;
        const draftRows=[...doc().querySelectorAll('#template-table tbody tr')];
        const start=draftRows[0].querySelector('[data-field="box_number"]');
        start.focus();
        const block=new DataTransfer(); block.setData('text/plain','BOX-A\tPOD-A\r\nBOX-B\tPOD-B\r\n');
        start.dispatchEvent(new ClipboardEvent('paste',{clipboardData:block,bubbles:true,cancelable:true}));
        assert(draftRows[1].querySelector('[data-field="box_number"]').value==='BOX-B','draft rectangular paste');
        navigation=loaded(); doc().getElementById('commit-template').click(); await navigation;
        assert(cells().length===6&&(await db()).rows.length===6,'explicit commit creates saved rows');
        const state=JSON.parse(doc().getElementById('receiving-state').textContent);
        const beforeReport=(await db()).writes;
        enter(doc().getElementById('incoming-invoice'),state.rows[0].invoice_number);
        doc().getElementById('incoming-form').requestSubmit();
        await wait(()=>doc().getElementById('incoming-status').textContent.includes('downloaded'),'template-based incoming Word download');
        assert((await db()).writes===beforeReport,'incoming form never writes receiving records');
        assert(JSON.parse(doc().getElementById('receiving-state').textContent).id===state.id,'incoming form preserves active workspace');
        assert(!doc().getElementById('receiving-workspace').contains(doc().getElementById('serial-tools')),'standalone tool separate from table');
        assert(!doc().getElementById('serial-group')&&!doc().getElementById('serial-scan-form'),'old scan/group sections removed');
        cells()[4].focus(); assert(!cells()[4].readOnly,'blank bulk cell accepts entry without Correct');
        cells()[2].focus(); assert(!cells()[2].readOnly,'blank unit cell accepts scanner');
        enter(cells()[2],'BROWSER-SCAN-1'); pressEnter(cells()[2]);
        await wait(()=>doc().activeElement===cells()[3],'Enter saves and advances to next blank unit');
        assert((await db()).rows[2].serial_number==='BROWSER-SCAN-1','table scan saved');
        const pasteRange = (first, last, text) => {
            first.focus();
            first.dispatchEvent(new PointerEvent('pointerdown',{button:0,buttons:1,bubbles:true}));
            last.dispatchEvent(new PointerEvent('pointerdown',{button:0,buttons:1,shiftKey:true,bubbles:true,cancelable:true}));
            frame.contentWindow.dispatchEvent(new PointerEvent('pointerup'));
            const clipboard=new DataTransfer(); clipboard.setData('text/plain',text);
            first.dispatchEvent(new ClipboardEvent('paste',{clipboardData:clipboard,bubbles:true,cancelable:true}));
        };
        const pasteWrites=(await db()).writes;
        pasteRange(cells()[2],cells()[3],'PASTE001\nPASTE002');
        assert(doc().getElementById('entry-message').textContent.includes('locked cell'),'saved serial protected from range paste');
        assert((await db()).writes===pasteWrites,'locked range rejected without writes');
        cells()[2].closest('tr').querySelector('.row-save').click();
        pasteRange(cells()[2],cells()[3],'SAME\nSAME');
        assert(doc().getElementById('entry-message').textContent.includes('duplicate'),'duplicates reject entire paste');
        assert((await db()).writes===pasteWrites,'duplicate paste never writes');
        pasteRange(cells()[2],cells()[3],'PASTE001\nPASTE002');
        await wait(async()=>{const rows=(await db()).rows;return rows[2].serial_number==='PASTE001'&&rows[3].serial_number==='PASTE002';},'selected range paste saved');
        assert((await db()).writes===pasteWrites+2,'two pasted cells save only their rows');
        assert(doc().querySelectorAll('#entry-table .grid-selected').length===2,'pasted range highlighted');
        const copyOut = () => { const data=new DataTransfer(); doc().dispatchEvent(new ClipboardEvent('copy',{clipboardData:data,bubbles:true,cancelable:true})); return data.getData('text/plain'); };
        assert(copyOut()==='PASTE001\r\nPASTE002\r\n','Ctrl+C copies the selected SN cells');
        const numbers=[...doc().querySelectorAll('#entry-table th.row-number')];
        numbers[1].click(); numbers[3].dispatchEvent(new MouseEvent('click',{shiftKey:true,bubbles:true}));
        assert(doc().querySelectorAll('#entry-table tr.row-selected').length===3,'row numbers select a row range');
        const copied=copyOut().trim().split('\r\n');
        assert(copied.length===3&&copied[1].split('\t').includes('PASTE001'),'Ctrl+C copies whole selected rows');
        doc().dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
        assert(!doc().querySelector('#entry-table tr.row-selected'),'Escape clears row selection');
        const snTd = i => cells()[i].closest('td');
        const press = (i, extra={}) => { snTd(i).dispatchEvent(new PointerEvent('pointerdown',{button:0,buttons:1,bubbles:true,cancelable:true,...extra})); frame.contentWindow.dispatchEvent(new PointerEvent('pointerup')); };
        press(2);
        assert(copyOut()===cells()[2].value+'\r\n','Ctrl+C copies a single SN cell');
        press(3, {ctrlKey:true}); press(5, {ctrlKey:true});
        assert(doc().querySelectorAll('#entry-table .grid-selected').length===3,'Ctrl-click picks separate SN cells');
        assert(copyOut()===[2,3,5].map(i=>cells()[i].value).join('\r\n')+'\r\n','picked cells copy as a column in table order');
        press(3, {ctrlKey:true});
        assert(doc().querySelectorAll('#entry-table .grid-selected').length===2,'Ctrl-click a picked cell drops it');
        doc().querySelector('#entry-table th.sn-heading').click();
        assert(doc().querySelectorAll('#entry-table .grid-selected').length===cells().length,'Serial number header selects every SN cell shown');
        assert(copyOut().split('\r\n').length-1===cells().length,'all SN cells copy, blanks kept in place');
        cells()[0].dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
        assert(!doc().querySelector('#entry-table .grid-selected'),'Escape clears the cell selection');
        pasteRange(cells()[4],cells()[4],'NA');
        await wait(async()=>(await db()).rows[4].serial_number==='NA','blank bulk cell accepts paste without Correct');
        assert((await db()).rows[4].quantity===3,'bulk SN paste preserves quantity');
        const before=(await db()).writes;
        enter(doc().getElementById('sequence-first'),'ABC000127');
        enter(doc().getElementById('sequence-count'),'20');
        doc().getElementById('sequence-form').requestSubmit();
        assert(doc().getElementById('sequence-output').value.split('\n').length===20,'generator has no row/group limits');
        assert((await db()).writes===before,'generator independent of loaded invoice');
        cells()[2].closest('tr').querySelector('.row-save').click();
        enter(cells()[2],'BROWSER-EDITED'); pressEnter(cells()[2]);
        await wait(async()=>(await db()).rows[2].serial_number==='BROWSER-EDITED','targeted correction saved');
        const saved=(await db()).rows;
        assert(saved.length===6&&saved[4].quantity===3&&saved[4].serial_number==='NA','bulk quantity unchanged after SN entry');
        navigation=loaded(); frame.src='/receiving'; await navigation;
        assert(cells()[2].value==='BROWSER-EDITED','reload reads database');
        result.textContent='PASS: header action bar and tool dialogs, standalone serial generator before invoice load, cell, Ctrl-click and row copy, no network/database writes, generation during draft review, direct scanning and Enter advancement, selected-range paste, locked-cell/duplicate rejection, corrections, blank bulk SN entry with quantity preservation, and read-only template-based incoming Word download. Isolated fake database only.';
    } catch(error) {result.textContent=`FAIL: ${error.stack}`;}
})();
</script></body></html>
