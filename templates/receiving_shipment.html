<section class="card mb-3 rcv-panel" id="shipment-upload" aria-labelledby="shipment-upload-heading" {% if shipment %}hidden{% endif %}>
    <div class="card-header d-flex align-items-center justify-content-between gap-2">
        <h2 class="h6 mb-0 fw-bold" id="shipment-upload-heading">New shipment</h2>
        {% if shipment %}<button type="button" class="btn btn-sm btn-outline-secondary" data-close-panel="shipment-upload" aria-label="Close new shipment">Close</button>{% endif %}
    </div>
    <form id="shipment-upload-form" class="card-body" action="{{ url_for('receiving.generate_shipment') }}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ session.receiving_csrf }}">
        <input type="hidden" name="workspace_id" value="{{ shipment.id if shipment else '' }}">
        <input type="hidden" name="revision" value="{{ shipment.revision if shipment else '' }}">
        <div class="row g-3 align-items-end">
            <div class="col-md"><label for="receipt" class="form-label">QuickBooks receipt (PDF)</label><input id="receipt" name="receipt" type="file" accept=".pdf" class="form-control" required></div>
            <div class="col-md"><label for="packing" class="form-label">Packing list (PDF)</label><input id="packing" name="packing" type="file" accept=".pdf" class="form-control" required></div>
            <div class="col-md"><label for="serials" class="form-label" title="Headers: Customer PO No, Ordering Model, S/N, Invoice No">Serial export (Excel)</label><input id="serials" name="serials" type="file" accept=".xlsx,.xlsm" class="form-control" required></div>
            <div class="col-md-auto"><button type="submit" class="btn btn-primary">Generate draft</button></div>
        </div>
        <p class="small text-muted mt-2 mb-0">Draft only — nothing is saved until you review it.{% if shipment %} Opens in place of INV# {{ shipment.invoice_scope }}; saved records are not changed.{% endif %}</p>
    </form>
</section>
